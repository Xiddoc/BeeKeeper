[project]
name = "beekeeper"
version = "0.1.0"
description = "Manage the Bee-sy with ease."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Xiddoc", email = "xiddoc@xiddoc.pc" }
]
keywords = ["scheduling", "allocation", "constraints", "rostering", "assignment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11.5",
    "setuptools>=80",
]

[project.urls]
Homepage = "https://github.com/Xiddoc/Beekeeper"
Documentation = "https://xiddoc.github.io/Beekeeper/"
Repository = "https://github.com/Xiddoc/Beekeeper"
Issues = "https://github.com/Xiddoc/Beekeeper/issues"

[dependency-groups]
dev = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.11.12",
]

examples = [
    "faker>=37.3.0",
]

#[project.scripts]
#beekeeper = "beekeeper:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
beekeeper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--benchmark-skip"]

[tool.mypy]
strict = true
follow_untyped_imports = true
disallow_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["examples"]
plugins = "pydantic.mypy"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "S311", "T201", "PLR2004", "UP007", "INP001", "S105", "EM102", "TRY003", "EM101", "TD003", "FIX002", "TD002", "RUF002", "RUF003"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pylint]
# BeeKeeper.__init__ has 6 keyword-only arguments by design — it's the framework's
# wiring point. The PLR0913 default of 5 is too tight for that role. Bump rather
# than scatter `# noqa: PLR0913` across the wiring code.
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "ARG", "PT011", "SLF001"]
"examples/**/*.py" = ["ANN", "ARG", "D", "DTZ001"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-line-length = "dynamic"
