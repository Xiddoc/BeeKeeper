name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy src

      - name: Pytest (with coverage)
        # `coverage run` drives pytest; `coverage report` fails the build if
        # total coverage drops below the `fail_under` threshold in
        # `[tool.coverage.report]` (currently 100%).
        run: |
          uv run coverage run -m pytest
          uv run coverage report
          uv run coverage xml

      - name: Pytest (benchmarks)
        run: uv run pytest --benchmark-only --benchmark-columns=min,mean,stddev,max,outliers

      - name: MkDocs (build --strict)
        run: uv run mkdocs build --strict
